name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip (if present) and find project
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          if [ -n "$ZIP" ]; then
            echo "Unpacking $ZIP"
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            ROOT=_src
          else
            ROOT=.
          fi
          BG=$(find "$ROOT" -maxdepth 3 -name build.gradle -not -path '*/.git/*' | head -n1)
          if [ -z "$BG" ]; then echo "build.gradle not found"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$BG")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vclient-mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
